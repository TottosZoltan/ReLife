<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16232e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReLife">
<title>ReLife</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-st="adult">
  <header>
    <div id="av"></div>
    <div class="info">
      <b id="nm"></b>
      <div id="sg"></div>
      <div class="row"><span id="mo"></span><button id="nw" class="ghost" data-i="menu"></button></div>
    </div>
    <div id="age"><i id="ag">0</i><small data-i="yr"></small></div>
  </header>
  <section id="bars"></section>
  <main id="view"></main>
  <footer id="dock">
    <button data-s="job"><i>💼</i><span data-i="work"></span></button>
    <button data-s="assets"><i>🏠</i><span data-i="assets"></span></button>
    <button id="up"><b>+1</b><span data-i="yr"></span></button>
    <button data-s="rel"><i>👥</i><span data-i="ppl"></span></button>
    <button data-s="act"><i>🎯</i><span data-i="todo"></span></button>
  </footer>
  <div id="sheet" class="ov sheet" hidden><div class="panel"><div class="grab"><b id="stt"></b><button id="cls" aria-label="Bezár">✕</button></div><div id="sbody"></div></div></div>
  <div id="modal" class="ov" hidden><div class="box"><h2 id="mt"></h2><p id="md"></p><div id="mb"></div></div></div>
  <div id="end" class="ov" hidden><div class="box"><h2 data-i="endt"></h2><p id="es"></p><button id="again" data-i="again"></button></div></div>

  <div id="title" class="scr">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <h1 id="logo" aria-label="ReLife"><span style="--i:0">R</span><span style="--i:1">e</span><span style="--i:2">L</span><span style="--i:3">i</span><span style="--i:4">f</span><span style="--i:5">e</span></h1>
    <p class="tag" data-i="tag"></p>
    <div class="tl"><i></i></div>
    <button id="tnew" class="big" data-i="start"></button>
    <button id="tcont" class="big alt" hidden data-i="cont"></button>
    <div class="lang"><small data-i="lang"></small><button class="chip" data-l="hu">Magyar</button><button class="chip" data-l="en">English</button></div>
  </div>

  <div id="create" class="scr" hidden>
    <div class="cwrap">
      <div class="cstick">
        <div id="cav"></div>
        <div class="names">
          <input id="cln" data-ip="sur" maxlength="16" autocomplete="off">
          <input id="cfn" data-ip="giv" maxlength="16" autocomplete="off">
          <button id="dice" aria-label="Véletlen név">🎲</button>
        </div>
      </div>
      <button id="cback" class="ghost" data-i="back"></button>
      <div id="copts"></div>
      <div class="cbtns"><button id="crand" data-i="ra"></button><button id="cgo" data-i="go"></button></div>
    </div>
  </div>

  <div id="flash"></div>
  <canvas id="cv"></canvas>
</div>
<script src="script.js"></script>
</body>
</html>
